<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta
      name="description"
      content="Eine einfache Pokédex-Webanwendung mit JavaScript, DOM, Fetch API und LocalStorage. Entdecke Pokémon, suche nach Name oder ID, speichere Favoriten und verfasse persönliche Notizen."
    />
    <title>Pokédex-Tagebuch</title>
    <link rel="icon" type="image/svg+xml" href="./assets/icons/pokeball.svg" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100 antialiased">
    <header
      class="sticky top-0 z-50 border-b border-white/10 bg-slate-950/90 backdrop-blur-xl"
    >
      <nav
        class="mx-auto flex max-w-7xl items-center justify-between px-4 py-3 sm:px-6 lg:px-8"
      >
        <a href="./index.html" class="group flex items-center gap-3">
          <span
            class="grid size-10 place-items-center rounded-xl bg-red-500 shadow-lg shadow-red-500/20 transition-transform group-hover:rotate-12"
          >
            <img
              src="./assets/icons/pokemon.svg"
              alt=""
              class="size-6 invert"
            />
          </span>
          <span>
            <span class="block text-base font-black leading-none tracking-tight"
              >Pokédex</span
            >
            <span class="text-xs font-medium text-slate-400">Tagebuch</span>
          </span>
        </a>
        <div class="hidden items-center gap-1 md:flex">
          <a
            href="./index.html"
            class="rounded-lg bg-white/10 px-4 py-2 text-sm font-semibold text-white"
            >Pokédex</a
          >
          <a
            href="./pokedex.html"
            class="rounded-lg px-4 py-2 text-sm font-medium text-slate-300 transition hover:bg-white/5 hover:text-white"
            >Gefangen</a
          >
        </div>
        <label
          for="mobile-menu-toggle"
          class="grid size-10 place-items-center rounded-lg border border-white/10 text-slate-200 transition hover:bg-white/10 md:hidden"
        >
          <svg
            class="size-5"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </label>
      </nav>
      <input
        id="mobile-menu-toggle"
        class="mobile-menu-toggle sr-only"
        type="checkbox"
      />
      <div
        class="mobile-menu hidden border-t border-white/10 px-4 py-3 md:hidden"
      >
        <div class="mx-auto grid max-w-7xl gap-1">
          <a
            href="./index.html"
            class="rounded-lg bg-white/10 px-4 py-3 text-sm font-semibold text-white"
            >Pokédex</a
          >
          <a
            href="./pokedex.html"
            class="rounded-lg px-4 py-3 text-sm font-medium text-slate-300 hover:bg-white/5 hover:text-white"
            >Gefangen</a
          >
        </div>
      </div>
    </header>
    <main class="mx-auto max-w-7xl px-4 py-10 sm:px-6 lg:px-8">
      <section>
        <div
          class="relative mb-10 overflow-hidden rounded-[2rem] border border-white/10 bg-slate-900/70 p-6 shadow-2xl shadow-black/20 sm:p-8 lg:p-10"
        >
          <div
            class="pointer-events-none absolute -right-24 -top-32 size-80 rounded-full bg-red-500/10 blur-3xl"
          ></div>
          <div class="relative">
            <div
              class="flex flex-col gap-6 md:flex-row md:items-start md:justify-between"
            >
              <div>
                <p
                  class="mb-3 text-xs font-black uppercase tracking-[0.25em] text-red-400 sm:text-sm"
                >
                  Pokémon entdecken
                </p>
                <h1
                  class="text-3xl font-black tracking-tight text-white sm:text-5xl"
                >
                  Dein Pokédex
                </h1>
                <p
                  class="mt-4 max-w-2xl text-sm leading-6 text-slate-400 sm:text-base"
                >
                  Finde ein Pokémon und entdecke seine Typen, Fähigkeiten und
                  wichtigsten Basiswerte.
                </p>
              </div>

              <div class="shrink-0 space-y-2 md:w-fit md:min-w-[220px]">
                <div
                  class="flex items-center gap-3 rounded-2xl border border-white/10 bg-slate-950/60 px-4 py-3"
                >
                  <span
                    class="grid size-10 place-items-center rounded-xl bg-red-500/15"
                  >
                    <img
                      class="size-6"
                      src="./assets/icons/pokeball.svg"
                      alt=""
                    />
                  </span>
                  <span>
                    <span
                      class="block text-[10px] font-bold uppercase tracking-widest text-slate-500"
                    >
                      Verfügbar
                    </span>
                    <span class="text-lg font-black text-white">
                      <span id="pokemon-total">—</span> Pokémon
                    </span>
                  </span>
                </div>
                <button
                  id="search-toggle"
                  class="group flex w-full cursor-pointer items-center gap-3 rounded-2xl border border-white/10 bg-white/[0.03] px-4 py-3 text-sm font-bold text-slate-300 transition hover:border-red-500/30 hover:bg-red-500/10 hover:text-white active:scale-[0.98]"
                  type="button"
                >
                  <span
                    class="grid size-10 place-items-center rounded-xl bg-red-500/15 transition group-hover:bg-red-500/25"
                  >
                    <img
                      class="size-6 brightness-0 invert opacity-70 transition group-hover:opacity-100"
                      src="./assets/icons/search.svg"
                      alt=""
                    />
                  </span>
                  <span id="search-toggle-label">Suche öffnen</span>
                </button>
              </div>
            </div>
            <form id="pokemon-search-form" class="mt-8 hidden">
              <label
                for="pokemon-search"
                class="mb-2 block text-sm font-bold text-slate-200"
              >
                Pokémon suchen
              </label>
              <div class="flex flex-col gap-3 sm:flex-row">
                <div class="relative min-w-0 flex-1">
                  <img
                    class="pointer-events-none absolute left-4 top-1/2 size-5 -translate-y-1/2"
                    src="./assets/icons/search.svg"
                    alt=""
                  />
                  <input
                    id="pokemon-search"
                    class="w-full rounded-2xl border border-white/10 bg-slate-950/70 py-4 pl-12 pr-5 text-white outline-none transition placeholder:text-slate-600 focus:border-red-400 focus:ring-4 focus:ring-red-500/10"
                    type="search"
                    name="pokemon"
                    placeholder="Name oder ID eingeben …"
                    autocomplete="off"
                    spellcheck="false"
                    required
                  />
                </div>
                <button
                  class="cursor-pointer rounded-2xl bg-red-500 px-7 py-4 text-sm font-black text-white shadow-lg shadow-red-500/20 transition hover:bg-red-400 active:scale-95 md:min-w-[220px]"
                  type="submit"
                >
                  Pokémon finden
                </button>
              </div>
              <p class="mt-3 text-xs leading-5 text-slate-500">
                Suche nach dem vollständigen Namen oder einer numerischen ID.
              </p>
            </form>
          </div>
        </div>
        <div
          id="pokemon-grid"
          class="grid gap-6 sm:grid-cols-2 xl:grid-cols-3"
        ></div>
        <div id="pokemon-sentinel"></div>
      </section>
    </main>
    <dialog
      id="search-dialog"
      class="m-auto max-h-[calc(100dvh-2rem)] w-[calc(100%-2rem)] max-w-lg overflow-y-auto rounded-3xl border border-white/10 bg-slate-950 p-0 text-slate-100 shadow-2xl shadow-black/60"
    >
      <div
        class="sticky top-0 z-20 flex items-center justify-between border-b border-white/10 bg-slate-950/95 px-5 py-4 backdrop-blur-xl"
      >
        <h2 class="text-lg font-black">Suchergebnis</h2>
        <button
          id="search-dialog-close"
          class="grid size-9 cursor-pointer place-items-center rounded-full bg-white/5 transition hover:bg-white/10"
          type="button"
        >
          <img class="size-4" src="./assets/icons/close.svg" alt="Schließen" />
        </button>
      </div>
      <div id="search-result" class="p-4 sm:p-5"></div>
    </dialog>
    <script type="module" src="./main.js"></script>
  </body>
</html>
